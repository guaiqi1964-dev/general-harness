<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>General Harness</title>
<style>
:root { --bg:#1e2228; --panel:#262b33; --border:#3a3f45; --fg:#d8dee6;
        --muted:#8f959e; --accent:#5E81AC; --think:#8a6d3b; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI",sans-serif;
       display:flex; flex-direction:column; height:100vh; }
header { padding:10px 16px; border-bottom:1px solid var(--border);
         display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
header h1 { font-size:16px; margin-right:auto; }
header h1 .tag { font-size:12px; font-weight:normal; color:var(--muted); margin-left:6px; }
select, input, button { background:var(--panel); color:var(--fg);
        border:1px solid var(--border); border-radius:6px; padding:5px 10px; font-size:13px; }
button { cursor:pointer; } button:hover { border-color:var(--accent); }
button:disabled { opacity:.5; cursor:default; }
#chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:82%; padding:10px 14px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
.user { align-self:flex-end; background:#234a6e; }
.assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--border); }
details.think { margin-top:8px; border:1px dashed var(--think); border-radius:6px;
        padding:6px 10px; font-size:13px; color:#c9b98a; }
details.think summary { cursor:pointer; color:var(--think); }
details.think[open] summary { margin-bottom:6px; }
details.think div { white-space:pre-wrap; color:#a99e8a; }
#inputbar { display:flex; gap:10px; padding:12px 16px; border-top:1px solid var(--border); }
#input { flex:1; background:var(--panel); color:var(--fg); border:1px solid var(--border);
         border-radius:6px; padding:8px 12px; font-size:14px; resize:none; }
#status { padding:4px 16px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); }
button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
#gwkey { width:170px; }
#usagePanel { margin:0 16px 12px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 14px; max-height:40vh; overflow-y:auto; }
#usagePanel .usage-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:bold; }
#usagePanel .usage-head button { padding:2px 8px; }
.usage-row { display:flex; gap:12px; padding:4px 0; border-bottom:1px solid var(--border); font-size:13px; }
.usage-row span:nth-child(1) { flex:1; word-break:break-all; color:var(--muted); }
.usage-row span:nth-child(3) { color:var(--accent); white-space:nowrap; }
.usage-total { margin-top:8px; font-weight:bold; color:var(--accent); }
#keysPanel { margin:0 16px 12px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 14px; max-height:45vh; overflow-y:auto; }
#keysPanel .usage-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:bold; }
#keysPanel .usage-head button { padding:2px 8px; }
.keys-row { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
.keys-row .pname { width:96px; color:var(--accent); }
.keys-row .pstate { width:170px; color:var(--muted); font-size:12px; }
.keys-row input { flex:1; min-width:120px; }
.keys-row button { white-space:nowrap; }
.hint { color:var(--muted); font-size:12px; }
.sources { margin-top:10px; border-top:1px solid var(--border); padding-top:8px;
        display:flex; flex-direction:column; gap:6px; }
.sources .src-head { color:var(--muted); font-size:12px; }
a.src { display:flex; gap:8px; align-items:baseline; text-decoration:none; color:var(--fg);
        background:var(--bg); border:1px solid var(--border); border-radius:6px;
        padding:6px 10px; font-size:13px; }
a.src:hover { border-color:var(--accent); }
a.src .idx { color:var(--accent); }
a.src .title { flex:1; word-break:break-word; }
a.src .host { color:var(--muted); font-size:12px; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <h1>General Harness<span class="tag">浏览器版 · 无需 Python</span></h1>
  <label class="hint">模型</label>
  <select id="model"></select>
  <input id="gwkey" type="password" placeholder="网关 Key（可选）" title="设置 gateway_api_key 后需填写，保存在本机 localStorage">
  <button id="deep">🧠 深度思考</button>
  <button id="web" title="开启后由引擎先做一次联网检索，再把带来源的资料交给模型">🌐 联网</button>
  <button id="keys" title="在这里直接粘贴各厂商的 API Key，保存后立即生效（无需重启、无需改 YAML）">🔑 密钥</button>
  <button id="usage">📊 用量</button>
  <button id="refresh">刷新</button>
  <button id="clear">清空</button>
</header>
<div id="usagePanel" hidden>
  <div class="usage-head"><span>📊 Token 用量统计</span><button id="usageClose">✕</button></div>
  <div class="usage-subhead">历史对话</div>
  <div id="usageBody"></div>
</div>
<div id="keysPanel" hidden>
  <div class="usage-head"><span>🔑 API 密钥</span><button id="keysClose">✕</button></div>
  <div class="hint" style="margin-bottom:8px">粘贴各厂商的 API Key 后点「保存」，引擎会写入 keys.yaml 并立即热加载，无需重启、无需设置环境变量。Key 只保存在本机，不会上传。</div>
  <div id="keysList"></div>
</div>
<div id="chat"></div>
<div id="status">就绪</div>
<div id="inputbar">
  <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
  <button id="send">发送</button>
</div>
<script>
const $ = s => document.querySelector(s);
const chat = $('#chat'), modelSel = $('#model'), input = $('#input');
const statusEl = $('#status'), sendBtn = $('#send');
const deepBtn = $('#deep'), usageBtn = $('#usage'), usagePanel = $('#usagePanel'), usageBody = $('#usageBody'), gwkeyInput = $('#gwkey');
const webBtn = $('#web');
const keysBtn = $('#keys'), keysPanel = $('#keysPanel'), keysList = $('#keysList');
let history = [];
let deepThinking = false;
let webSearch = localStorage.getItem('websearch') === '1';
let webNoticeShown = localStorage.getItem('websearchNotice') === '1';
let sessionId = 'sess-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escAttr = s => esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function gwKey() { return (localStorage.getItem('gwkey') || '').trim(); }
function authHeaders() {
  const h = {'Content-Type':'application/json'};
  const k = gwKey();
  if (k) h['Authorization'] = 'Bearer ' + k;
  return h;
}

async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign(authHeaders(), opts.headers || {});
  const r = await fetch('/api'+path, Object.assign({}, opts, {headers}));
  if (!r.ok) { let m = await r.text(); try { m = JSON.parse(m).error?.message || m; } catch(e){} throw new Error(m); }
  return r.json();
}
async function loadModels() {
  try {
    const d = await api('/models');
    modelSel.innerHTML = d.data.map(m => '<option>'+esc(m.id)+'</option>').join('');
    statusEl.textContent = '已加载 ' + d.data.length + ' 个模型';
  } catch(e) { statusEl.textContent = '模型加载失败: '+e.message; }
}
function toggleDeep() {
  deepThinking = !deepThinking;
  deepBtn.classList.toggle('active', deepThinking);
  if (deepThinking) {
    const opt = [...modelSel.options].find(o => o.value.includes('reasoner'));
    if (opt) { modelSel.value = opt.value; statusEl.textContent = '深度思考已开启：' + opt.value; }
    else statusEl.textContent = '未找到推理模型，请在模型列表手动选择';
  } else {
    const opt = [...modelSel.options].find(o => /chat|plus|turbo/.test(o.value));
    if (opt) { modelSel.value = opt.value; statusEl.textContent = '深度思考已关闭：' + opt.value; }
    else statusEl.textContent = '深度思考已关闭';
  }
}
async function loadUsage() {
  try {
    const r = await fetch('/v1/usage/stats?limit=20', {headers: authHeaders()});
    if (!r.ok) throw new Error('请求失败');
    const d = await r.json();
    const rows = (d.data || []).map(item => {
      const t = item.last_ts ? new Date(item.last_ts * 1000).toLocaleString() : '';
      return '<div class="usage-row"><span>' + esc(item.label || item.session_id || '') + '</span><span>' + esc(item.model_name || '') + '</span><span>' + item.tokens + ' tokens</span><span>' + t + '</span></div>';
    }).join('');
    const total = (d.data || []).reduce((s, x) => s + (x.tokens || 0), 0);
    usageBody.innerHTML = rows || '<div class="hint">暂无用量记录</div>';
    usageBody.innerHTML += '<div class="usage-total">总计：' + total + ' tokens</div>';
    usagePanel.hidden = false;
  } catch(e) {
    statusEl.textContent = '用量加载失败：' + e.message;
  }
}
async function loadKeys() {
  try {
    const r = await fetch('/v1/keys', {headers: authHeaders()});
    const d = await r.json();
    if (!r.ok) throw new Error((d.error && d.error.message) || '加载失败');
    if (!d.providers || !d.providers.length) { keysList.innerHTML = '<div class="hint">没有可用厂商</div>'; return; }
    keysList.innerHTML = d.providers.map(p => {
      const state = p.placeholder ? '占位符（请求会失败）' : (p.configured ? '已配置 ' + (p.masked || '') : '未配置');
      return '<div class="keys-row" data-p="' + escAttr(p.name) + '">' +
        '<span class="pname">' + esc(p.name) + '</span>' +
        '<span class="pstate">' + esc(state) + '</span>' +
        '<input type="password" placeholder="粘贴 ' + escAttr(p.name) + ' 的 API Key" autocomplete="off">' +
        '<button class="save">保存</button></div>';
    }).join('');
    keysList.querySelectorAll('.keys-row').forEach(row => {
      const btn = row.querySelector('.save'), inp = row.querySelector('input');
      btn.onclick = async () => {
        const key = inp.value.trim();
        if (!key) { statusEl.textContent = '请先粘贴 Key'; return; }
        btn.disabled = true;
        try {
          const r2 = await fetch('/v1/keys', {method:'POST', headers: authHeaders(),
            body: JSON.stringify({provider: row.dataset.p, key})});
          const d2 = await r2.json();
          if (!r2.ok) throw new Error((d2.error && d2.error.message) || '保存失败');
          statusEl.textContent = row.dataset.p + ' 的 Key 已保存（' + d2.masked + '），立即生效';
          inp.value = '';
          await loadKeys();
        } catch(e) { statusEl.textContent = '保存失败: ' + e.message; }
        finally { btn.disabled = false; }
      };
    });
  } catch(e) {
    keysList.innerHTML = '<div class="hint">加载失败: ' + esc(e.message) + '</div>';
  }
}
function toggleKeys() {
  const open = keysPanel.hidden;
  keysPanel.hidden = !open;
  keysBtn.classList.toggle('active', open);
  if (open) loadKeys();
}
function addMsg(role, text, thinking) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (thinking) {
    div.innerHTML = '<details class="think" open><summary>💭 思考过程</summary><div>'+esc(thinking)+'</div></details><div>'+esc(text)+'</div>';
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function setBusy(b) { sendBtn.disabled = b; input.disabled = b; }

// ---- 联网检索：开关状态、隐私提示、来源卡片 ----
function applyWebSearch() {
  webBtn.classList.toggle('active', webSearch);
  webBtn.textContent = webSearch ? '🌐 联网：开' : '🌐 联网';
}
function hostOf(u) { try { return new URL(u).host; } catch(e) { return ''; } }
function sourcesHtml(list) {
  const items = (list || []).map(s => {
    const url = String(s.url || ''), host = hostOf(url);
    return '<a class="src" href="'+escAttr(url)+'" target="_blank" rel="noopener noreferrer">'+
      '<span class="idx">['+esc(String(s.index==null?'':s.index))+']</span>'+
      '<span class="title">'+esc(String(s.title || host || url))+'</span>'+
      '<span class="host">'+esc(host)+'</span></a>';
  }).join('');
  if (!items) return '';
  return '<div class="sources"><div class="src-head">🌐 来源（点击在新窗口打开）</div>'+items+'</div>';
}
function renderBubble(bubble, full, think, sources) {
  let html = '';
  if (think) html += '<details class="think" open><summary>💭 思考过程</summary><div>'+esc(think)+'</div></details>';
  html += '<div>'+esc(full)+'</div>';
  html += sourcesHtml(sources);
  bubble.innerHTML = html;
}
async function toggleWeb() {
  if (webSearch) {
    webSearch = false; localStorage.setItem('websearch','0'); applyWebSearch();
    statusEl.textContent = '联网检索已关闭';
    return;
  }
  // 开启前确认引擎侧已启用且有就绪后端（关闭时路由不注册，返回 404）。
  try {
    const r = await fetch('/v1/search/backends', {headers: authHeaders()});
    if (r.status === 404) { statusEl.textContent = '引擎未启用联网检索（config.yaml 中 search.enabled=false）'; return; }
    if (!r.ok) { statusEl.textContent = '无法确认搜索后端状态：HTTP ' + r.status; return; }
    const d = await r.json();
    const ready = (d.data || []).filter(x => x.ready);
    if (!ready.length) { statusEl.textContent = '没有就绪的搜索后端，请检查 config.yaml 中的 search.backends'; return; }
  } catch(e) { statusEl.textContent = '无法连接引擎：' + e.message; return; }
  webSearch = true; localStorage.setItem('websearch','1'); applyWebSearch();
  if (!webNoticeShown) {
    webNoticeShown = true; localStorage.setItem('websearchNotice','1');
    statusEl.textContent = '联网已开启：只把引擎本地提取的检索词发给搜索服务，不含你的问题原文';
  } else {
    statusEl.textContent = '联网检索已开启';
  }
}

async function send() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = ''; setBusy(true); statusEl.textContent = webSearch ? '正在检索…' : '生成中…';
  addMsg('user', text);
  const bubble = addMsg('assistant', '');
  try {
    const payload = {model: modelSel.value, messages: history.concat([{role:'user',content:text}]), stream: true, stream_options: {include_usage: true}, session_id: sessionId};
    // 未开启联网时请求体与旧版本逐字段一致（G2）。
    if (webSearch) payload.web_search = true;
    const r = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify(payload)
    });
    if (!r.ok || !r.body) throw new Error('请求失败');
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '', full = '', think = '', sources = null;
    bubble.textContent = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, idx); buf = buf.slice(idx+2);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        let ev; try { ev = JSON.parse(data); } catch(e) { continue; }
        if (ev.error) throw new Error(ev.error.message || '网关错误');
        // 检索事件块（正文块之前）：先落来源卡片，再继续流式正文。
        if (ev.phase === 'search') {
          sources = ev.sources || [];
          statusEl.textContent = '已检索到 ' + sources.length + ' 条来源，生成中…';
          renderBubble(bubble, full, think, sources);
          chat.scrollTop = chat.scrollHeight;
          continue;
        }
        // 仅在 thinking 为非空字符串时累加（引擎对无思考的块输出 null，
        // 直接 += 会把 null 转成字符串 "null" 污染思考面板）。
        if (typeof ev.thinking === 'string' && ev.thinking.length > 0) {
          think += ev.thinking;
        }
        if (ev.content) { full += ev.content; }
        if (ev.content || think) {
          renderBubble(bubble, full, think, sources);
          chat.scrollTop = chat.scrollHeight;
        }
      }
    }
    renderBubble(bubble, full, think, sources);
    history = history.concat([{role:'user',content:text},{role:'assistant',content:full}]);
    statusEl.textContent = '完成';
  } catch(e) {
    bubble.textContent = '✗ ' + e.message;
    statusEl.textContent = '错误';
  }
  setBusy(false);
}
$('#send').onclick = send;
$('#clear').onclick = () => { history = []; chat.innerHTML = ''; sessionId = 'sess-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };
$('#refresh').onclick = loadModels;
$('#deep').onclick = toggleDeep;
$('#web').onclick = toggleWeb;
$('#usage').onclick = loadUsage;
$('#usageClose').onclick = () => { usagePanel.hidden = true; };
$('#keys').onclick = toggleKeys;
$('#keysClose').onclick = () => { keysPanel.hidden = true; keysBtn.classList.remove('active'); };
gwkeyInput.value = localStorage.getItem('gwkey') || '';
gwkeyInput.onchange = () => { localStorage.setItem('gwkey', gwkeyInput.value.trim()); loadModels(); if (!usagePanel.hidden) loadUsage(); };
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
applyWebSearch();
loadModels();
</script>
</body>
</html>
