# =============================================================
# 全局配置
# =============================================================

server:
  # 默认仅监听本机（127.0.0.1），避免局域网/公网任意设备调用网关消耗额度。
  # 如需局域网共享，改为 0.0.0.0，并强烈建议同时设置 gateway_api_key。
  host: 127.0.0.1
  port: 8000

# 网关访问鉴权（可选，强烈建议对外暴露时开启）：
# 设置后，/v1/chat/completions 与 /v1/models 必须携带
#   Authorization: Bearer <该值>
# gateway_api_key: ""

# CORS 允许的来源（可选）：默认 * 允许任意来源。
# 对外暴露时建议改为具体域名，如 https://example.com。
# cors_allow_origin: "*"

# 简易限流（可选）：单 IP 每分钟最大请求数，0 表示不限流。
# /health 不受限流影响。
rate_limit_per_minute: 60

# 模型别名：把简短的别名映射到 厂商/模型
aliases:
  fast: deepseek/deepseek-chat
  smart: qwen/qwen-plus
  long: kimi/moonshot-v1-8k

# 未指定 model 时使用的默认模型
default_model: deepseek/deepseek-chat

# Agent 命令执行（可选，高风险，默认关闭）：
# 开启后，模型可通过 POST /v1/agent/run 在安全约束下执行宿主系统命令。
agent:
  enabled: false
  # 允许执行的可执行文件名白名单（忽略大小写、路径与扩展名）。
  allow_commands:
    - cmd
    - powershell
    - ping
    - ipconfig
  timeout_seconds: 30      # 单条命令超时（秒）
  max_output_bytes: 65536  # stdout/stderr 输出上限（字节）
  # work_dir: ""           # 工作目录（空 = 引擎工作目录）
